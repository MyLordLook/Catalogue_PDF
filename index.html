<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>LORDLOOK Catalogue 2026</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #2b2b2b;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            /* Prevent unwanted touch behavior */
            touch-action: manipulation;

            /* iPhone safe-area support */
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
        }

        /* Full-screen viewer */
        .viewer-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #2b2b2b;
        }

        /* Loading overlay */
        #loader {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            width: 100%;
            height: 100%;

            background: #2b2b2b;
            color: #ffffff;

            z-index: 10;

            transition: opacity 0.25s ease;
        }

        /* Spinner */
        .spinner {
            width: 40px;
            height: 40px;

            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin-bottom: 14px;
        }

        #loader p {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.2px;
            opacity: 0.9;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* PDF viewer */
        iframe {
            position: absolute;
            inset: 0;

            display: block;

            width: 100%;
            height: 100%;
            height: 100dvh;

            border: none;
            outline: none;

            background: #2b2b2b;

            z-index: 1;
        }

        /* Better sizing for smaller mobile screens */
        @media (max-width: 600px) {
            .viewer-container,
            iframe {
                height: 100dvh;
                min-height: 100dvh;
            }

            .spinner {
                width: 36px;
                height: 36px;
                border-width: 3px;
            }

            #loader p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="viewer-container">

        <!-- Loading screen -->
        <div id="loader">
            <div class="spinner"></div>
            <p>Loading Catalogue...</p>
        </div>

        <!-- PDF Catalogue -->
        <iframe
            src="LORDLOOK_Catalogue_2026.pdf"
            title="LORDLOOK Catalogue 2026"
            loading="eager"
            onload="
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 250);
            "
        ></iframe>

    </div>

</body>
</html>
